name: Denny zber dat do archivu

on:
  schedule:
    # Každý deň o 23:57 nášho času (21:57 UTC)
    - cron: '57 21 * * *'
  workflow_dispatch: # Tlačidlo na ručné spustenie v rozhraní GitHubu

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Bezpečnostná poistka (utne proces ak zavesí sieť)
    permissions:
      contents: write # Umožní uloženie zmien do CSV súboru

    steps:
      - name: Stiahnutie repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inštalácia knižníc
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Spustenie denného zberu
        run: python meteo_zber_v2.py

      - name: Uloženie zmien do archívu
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add meteo_puste_pole_v2.csv
          git commit -m "Denny zber do meteo_puste_pole_v2.csv" || echo "Žiadne zmeny na uloženie"
          git push
