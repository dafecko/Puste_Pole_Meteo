name: Automatický zber meteo dát

on:
  schedule:
    - cron: '*/15 * * * *'  # Spustí sa každých 15 minút (môžete upravením zmeniť)
  workflow_dispatch:      # Umožňuje spustiť skript aj manuálne jedným klikom na webe GitHubu

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inštalácia knižníc
        run: |
          pip install -r requirements.txt

      - name: Spustenie zberu dát
        run: |
          python update_weather.py
          python meteo_zber_v2.py

      - name: Automatické uloženie a odoslanie zmien na GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add meteo_aktualne.csv meteo_puste_pole_v2.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatická aktualizácia dát z GitHub Actions" && git push)