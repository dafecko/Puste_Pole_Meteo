name: Aktualizácia počasia

on:
  schedule:
    - cron: '*/15 * * * *'  # Každých 15 minút
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inštalácia knižníc
        run: pip install -r requirements.txt

      - name: Spustenie zberu dát
        run: |
          python update_weather.py

      - name: Automatické uloženie a odoslanie zmien na GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add meteo_aktualne.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatická aktualizácia dát" && git push)
